<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathekiste</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../eulenkiste-icon.png?v=2">
<link rel="stylesheet" href="../schriften/schriften.css?v=2">
<link rel="stylesheet" href="../style.css?v=25">
<style>
/* Mathekiste: gleich aufgebaut wie Englisch (englisch/index.html), mit den Mathe-Spielen */
.kk{max-width:1120px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 60px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.kk-oben{display:flex}
.lk-back{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 13px;border-radius:999px;background:#fff;color:#1f2421;text-decoration:none;font:700 19px/1 system-ui,sans-serif;box-shadow:0 4px 14px rgba(63,120,168,.2);flex:none}
.lk-back:hover{box-shadow:0 6px 18px rgba(63,120,168,.3)}
.lk-back img{width:36px;height:36px;display:block;border-radius:50%}
.kk-kopf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.kk-kopf::before{content:"✦ ✧ ✦";color:var(--gold);letter-spacing:.4em;font-size:15px}
.kk-bild{width:118px;height:118px;filter:drop-shadow(0 8px 16px rgba(63,120,168,.2))}
.kk-kopf h1{font-size:clamp(40px,6vw,56px);line-height:1;margin-top:6px}
.kk-kopf h1 em{font-style:normal;color:#c4952f}
.kk-kopf h1::after{content:" ✦";color:var(--gold);font-size:.5em;vertical-align:super}
.kk-kopf p{color:var(--muted);font-size:21px;max-width:560px}
.kk-arten{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.kk-art{font:inherit;font-size:21px;min-height:48px;padding:4px 22px;border-radius:999px;border:2px solid #c5d8e8;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px rgba(63,120,168,.12)}
.kk-art:hover{border-color:var(--ink)}
.kk-art[aria-pressed="true"]{background:var(--sky-soft);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kk-spiele{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.kk-karte{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:linear-gradient(180deg,#fff 0%,#fff 70%,#f7fbfe 100%);border:1.5px solid #e1edf7;border-radius:28px;padding:22px 20px 18px;box-shadow:var(--schatten);color:var(--ink);text-decoration:none;min-width:0;transition:transform .15s,box-shadow .15s}
.kk-karte:hover{transform:translateY(-3px);box-shadow:var(--schatten-hoch)}
.kk-ic{width:96px;height:96px;margin-bottom:4px}
.kk-fach{font-size:16px;color:var(--sky-deep);letter-spacing:.08em;text-transform:uppercase}
.kk-karte b{font-weight:400;font-size:32px;line-height:1.05}
.kk-karte p{color:var(--muted);font-size:19px;line-height:1.3}
.kk-los{margin-top:auto;align-self:stretch;text-align:center;font-size:22px;min-height:50px;display:grid;place-items:center;border-radius:16px;border:2px solid var(--ink);background:var(--sky-soft);box-shadow:0 4px 12px rgba(63,120,168,.14)}
.hinweis2{background:var(--sun-soft);border:1.5px dashed var(--gold);border-radius:20px;padding:14px 18px;color:#4a3d1a;font-size:18px}
@media (prefers-reduced-motion:reduce){.kk-karte{transition:none}.kk-karte:hover{transform:none}}
/* kompakt wie Englisch */
.kk{gap:16px;padding-top:16px;padding-bottom:24px}
.kk-oben{margin-bottom:-56px;position:relative;z-index:2;pointer-events:none}
.kk-oben .lk-back{pointer-events:auto}
.kk-bild{width:96px;height:96px}
.kk-kopf{gap:2px}
.kk-kopf p{margin-top:10px;line-height:1.3}
.kk-kopf h1{font-size:clamp(36px,5vw,48px)}
.kk-spiele{grid-template-columns:repeat(auto-fit,minmax(260px,360px));justify-content:center}
.kk-ic{width:80px;height:80px}
.hinweis2{font-size:16px;padding:10px 16px}
</style>
</head>
<body>
<main class="kk">
  <div class="kk-oben"><a class="lk-back" href="../#lernspiele" title="Zurück zur Eulenkiste" aria-label="Zurück zur Eulenkiste"><span aria-hidden="true">←</span><img src="../eulenkiste.webp" alt="" width="36" height="36"></a></div>
  <div class="kk-kopf">
    <img class="kk-bild" src="../mathekiste-bild.webp?v=2" alt="" width="118" height="118">
    <h1>Mathekiste</h1>
    <p>Mathe üben mit Erklärungen und Merkblättern.</p>
  </div>
  <div class="kk-arten" role="group" aria-label="Welche Spiele?" id="arten" style="display:none"></div>
  <div class="kk-spiele" id="spiele"></div>
  <p class="hinweis2">Hier wird nichts gespeichert. In der Klassenkiste sammeln die Kinder Sterne, und die Lehrperson sieht ihren Stand.</p>
</main>
<script>
// Spiele in ../spiele/<id>.html, Bilder in ../spiele/<id>-bild.webp. Gewählte Art im Hash (#mathematik usw.), damit «←» im Spiel dorthin zurückführt.
var SPIELE = [
  ['rechenoperationen', 'Rechenoperationen', 'Mathe 5', 'Plus, Minus, Mal und Durch: im Kopf, halbschriftlich, schriftlich und flexibel. Mit Merkblättern.']];
var ARTEN = ['Alle'];
function h(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function art() { var a = decodeURIComponent(location.hash.slice(1)).toLowerCase(); return ARTEN.filter(function (x) { return x.toLowerCase() === a; })[0] || 'Alle'; }
function zeige() {
  var a = art();
  document.getElementById('arten').innerHTML = ARTEN.map(function (x) {
    return '<button class="kk-art" aria-pressed="' + (x === a) + '" data-art="' + x + '">' + x + '</button>'; }).join('');
  document.getElementById('spiele').innerHTML = SPIELE.filter(function (s) { return a === 'Alle' || s[2] === a; }).map(function (s) {
    return '<a class="kk-karte" href="../spiele/' + s[0] + '.html"><img class="kk-ic" src="../spiele/' + s[0] + '-bild.webp" alt="" width="96" height="96">' +
      '<span class="kk-fach">' + h(s[2]) + '</span><b>' + h(s[1]) + '</b><p>' + h(s[3]) + '</p><span class="kk-los">▶ Spielen</span></a>'; }).join('');
}
document.getElementById('arten').addEventListener('click', function (e) {
  var b = e.target.closest('[data-art]'); if (!b) return;
  history.replaceState(null, '', b.dataset.art === 'Alle' ? location.pathname : '#' + b.dataset.art.toLowerCase()); zeige();
});
window.addEventListener('hashchange', zeige);
zeige();
</script>
</body>
</html>
