<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Eulenkiste</title>
  <g stroke="#1f2421" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Rückwand der Kiste -->
    <path d="M16 64 L26 52 H94 L104 64 Z" fill="#a9d6f5"/>
    <!-- Eule, die aus der Kiste schaut -->
    <path d="M39 33 Q33 26 33 19 Q42 22 48 28 Z" fill="#c9b2a2"/>
    <path d="M81 33 Q87 26 87 19 Q78 22 72 28 Z" fill="#c9b2a2"/>
    <ellipse cx="60" cy="52" rx="27" ry="27" fill="#dccabd"/>
    <path d="M44 66 Q60 58 76 66 L76 80 H44 Z" fill="#f3e7de" stroke="none"/>
    <circle cx="49" cy="45" r="10" fill="#fff"/>
    <circle cx="71" cy="45" r="10" fill="#fff"/>
    <circle cx="50.5" cy="46" r="4.8" fill="#1f2421" stroke="none"/>
    <circle cx="69.5" cy="46" r="4.8" fill="#1f2421" stroke="none"/>
    <circle cx="52.2" cy="44.2" r="1.6" fill="#fff" stroke="none"/>
    <circle cx="71.2" cy="44.2" r="1.6" fill="#fff" stroke="none"/>
    <path d="M56 55 H64 L60 61 Z" fill="#d6ad45" stroke-width="2.5"/>
    <circle cx="41" cy="56" r="3.6" fill="#ec9d95" stroke="none" opacity=".75"/>
    <circle cx="79" cy="56" r="3.6" fill="#ec9d95" stroke="none" opacity=".75"/>
    <!-- Vorderseite der Kiste -->
    <rect x="16" y="64" width="88" height="42" rx="5" fill="#dcf0fd"/>
    <path d="M16 72 H104" stroke-width="2"/>
    <path d="M30 64 V106 M90 64 V106" stroke-width="2"/>
    <!-- Flügel halten sich am Rand fest -->
    <path d="M33 64 q4 -9 12 -6 q2 4 -1 8 Z" fill="#c9b2a2" stroke-width="3"/>
    <path d="M87 64 q-4 -9 -12 -6 q-2 4 1 8 Z" fill="#c9b2a2" stroke-width="3"/>
    <!-- Goldener Stern auf der Kiste -->
    <path d="M60 78 l3.2 6.4 7 1 -5.1 5 1.2 7 -6.3-3.3 -6.3 3.3 1.2-7 -5.1-5 7-1z" fill="#e7c25c" stroke-width="2.5"/>
  </g>
  <!-- Funkeln -->
  <path d="M102 22 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4-5.6 -5.6-2.4 5.6-2.4z" fill="#d6ad45" stroke="#1f2421" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="16" cy="34" r="4" fill="#9fd0f3"/>
</svg>
