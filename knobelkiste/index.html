<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knobelkiste</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../eulenkiste-icon.png?v=2">
<link rel="stylesheet" href="../schriften/schriften.css?v=2">
<link rel="stylesheet" href="../style.css?v=25">
<style>
/* Knobelkiste: Fächer als grosse Kacheln wie bei den Kindern in der Klassenkiste, ein Tipp zeigt die Spiele des Fachs */
.kk{max-width:1120px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 60px max(20px,env(safe-area-inset-left,0px))}
.kk-kopf{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lk-back{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 13px;border-radius:999px;background:#fff;color:#1f2421;text-decoration:none;font:700 19px/1 system-ui,sans-serif;box-shadow:0 4px 14px rgba(63,120,168,.2);flex:none;border:0;cursor:pointer}
.lk-back:hover{box-shadow:0 6px 18px rgba(63,120,168,.3)}
.lk-back img{width:36px;height:36px;display:block;border-radius:50%}
.kk-titel{display:flex;align-items:center;gap:16px;margin:26px 0 8px}
.kk-titel .rund{flex:none;width:104px;height:104px}
.kk-titel .rund img{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(63,120,168,.18))}
.kk-titel h1{font-size:clamp(40px,6vw,58px)}
.kk-titel h1 em{font-style:normal;color:#c4952f}
.kk-titel p{color:var(--muted);font-size:21px;margin-top:2px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px;margin-top:26px}
.kachel{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid rgba(31,36,33,.08);border-radius:30px;padding:28px 30px 30px;
  box-shadow:var(--schatten);color:var(--ink);text-decoration:none;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;min-width:0}
.kachel:hover{transform:translateY(-4px);box-shadow:var(--schatten-hoch)}
.kachel .rund{width:140px;height:140px;border-radius:50%;margin-bottom:8px;transition:transform .35s}
.kachel .rund img{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gold),0 8px 18px rgba(63,120,168,.2)}
.kachel .rund.mitrand img{box-shadow:0 8px 18px rgba(63,120,168,.2)}
.kachel:hover .rund{transform:rotate(-4deg) scale(1.04)}
.kachel b{font-weight:400;font-size:clamp(36px,4.5vw,46px);line-height:1.05}
.kachel b::after{content:" ✦";color:var(--gold);font-size:.45em;vertical-align:super}
.kachel span.anz{font-size:22px}
.kachel small{color:var(--muted);font-size:19px;line-height:1.3}
.f-deutsch{background:#f6e3a3}.f-mathematik{background:#cfdcef}.f-knobeln{background:#d9ecdf}
.spiel .rund{width:120px;height:120px}
.spiel b{font-size:clamp(30px,3.6vw,38px)}
.spiel .los{margin-top:auto;align-self:stretch;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:6px 0;font-size:21px}
.hinweis2{margin-top:34px;background:var(--sun-soft);border:1.5px dashed var(--gold);border-radius:20px;padding:14px 18px;color:#4a3d1a;font-size:18px}
@media (max-width:560px){.kachel{padding:22px 22px 24px}.kachel .rund{width:110px;height:110px}.kk-titel .rund{width:76px;height:76px}}
@media (prefers-reduced-motion:reduce){.kachel,.kachel .rund{transition:none}.kachel:hover{transform:none}}
</style>
</head>
<body>
<main class="kk">
  <div class="kk-kopf"><a class="lk-back" id="zurueck" href="../#lernspiele" title="Zurück zur Eulenkiste" aria-label="Zurück zur Eulenkiste"><span aria-hidden="true">←</span><img src="../eulenkiste.webp" alt="" width="36" height="36"></a></div>
  <div class="kk-titel">
    <span class="rund" id="titelbild"><img src="../knobelkiste-bild.webp" alt="" width="104" height="104"></span>
    <div><h1 id="titel">Knobel<em>kiste</em></h1><p id="unter">Welches Fach möchtest du üben?</p></div>
  </div>
  <div class="kacheln" id="kacheln"></div>
  <p class="hinweis2">Hier wird nichts gespeichert, ausser Ton und Rekorden auf diesem Gerät. In der Klassenkiste sammeln die Kinder Sterne, und die Lehrperson sieht ihren Stand.</p>
</main>
<script>
// Fächer und Spiele. Die Spiele liegen in ../spiele/<id>.html, die Bilder in ../spiele/<id>-bild.webp
var FAECHER = [
  { id: 'mathematik', name: 'Mathematik', bild: 'mathematik.webp', rand: true, spiele: [
    ['rechen-rakete', 'Rechen-Rakete', 'Rechnen und bis zum Mond fliegen'],
    ['uhr-lesen', 'Wie spät ist es?', 'Die Uhr lesen'],
    ['kiosk', 'Kiosk', 'Mit Franken und Rappen bezahlen']] },
  { id: 'deutsch', name: 'Deutsch', bild: 'deutsch.webp', rand: true, spiele: [
    ['wort-raten', 'Wort-Raten', 'Ein geheimes Wort erraten'],
    ['der-die-das', 'Der, die, das', 'Den richtigen Artikel finden'],
    ['silben-puzzle', 'Silben-Puzzle', 'Silben zum Wort ordnen']] },
  { id: 'knobeln', name: 'Knobeln', bild: 'knobeln.webp', rand: false, spiele: [
    ['bilderraetsel', 'Bilderrätsel', 'Felder ausmalen, bis ein Bild erscheint'],
    ['eulen-weg', 'Eulen-Weg', 'Die Eule nach Hause programmieren'],
    ['bilder-sudoku', 'Bilder-Sudoku', 'Jedes Bild nur einmal'],
    ['wasser-weg', 'Wasser-Weg', 'Röhren drehen, bis Wasser fliesst']] }
];
var $ = function (id) { return document.getElementById(id); };
function h(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function zeige() {
  var f = FAECHER.filter(function (x) { return '#' + x.id === location.hash; })[0];
  if (!f) {
    $('titel').innerHTML = 'Knobel<em>kiste</em>'; $('unter').textContent = 'Welches Fach möchtest du üben?';
    $('titelbild').innerHTML = '<img src="../knobelkiste-bild.webp" alt="" width="104" height="104">';
    $('zurueck').setAttribute('href', '../#lernspiele'); $('zurueck').setAttribute('aria-label', 'Zurück zur Eulenkiste'); $('zurueck').title = 'Zurück zur Eulenkiste';
    $('kacheln').innerHTML = FAECHER.map(function (x) {
      return '<a class="kachel f-' + x.id + '" href="#' + x.id + '"><span class="rund' + (x.rand ? '' : ' mitrand') + '"><img src="' + x.bild + '" alt="" width="140" height="140"></span><b>' + h(x.name) + '</b><span class="anz">' + x.spiele.length + ' Spiele</span></a>';
    }).join('');
  } else {
    $('titel').textContent = f.name; $('unter').textContent = 'Wähle ein Spiel';
    $('titelbild').innerHTML = '<img src="' + f.bild + '" alt="" width="104" height="104"' + (f.rand ? ' style="border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 6px #d6ad45"' : '') + '>';
    $('zurueck').setAttribute('href', '#'); $('zurueck').setAttribute('aria-label', 'Zurück zu den Fächern'); $('zurueck').title = 'Zurück zu den Fächern';
    $('kacheln').innerHTML = f.spiele.map(function (s) {
      return '<a class="kachel spiel f-' + f.id + '" href="../spiele/' + s[0] + '.html"><span class="rund mitrand"><img src="../spiele/' + s[0] + '-bild.webp" alt="" width="120" height="120"></span><b>' + h(s[1]) + '</b><small>' + h(s[2]) + '</small><span class="los">▶ Spielen</span></a>';
    }).join('');
  }
  window.scrollTo(0, 0);
}
$('zurueck').addEventListener('click', function (e) { if (location.hash) { e.preventDefault(); history.pushState(null, '', location.pathname); zeige(); } });
window.addEventListener('hashchange', zeige);
window.addEventListener('popstate', zeige);
zeige();
</script>
</body>
</html>
